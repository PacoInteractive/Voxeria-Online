<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXERIA // GEHEIME PROJEKTDATEN</title>
<style>
  :root {
    --bg: #050807;
    --grid: #0b1512;
    --green: #39ff8f;
    --green-dim: #14522f;
    --cyan: #4ce0ff;
    --amber: #ffb454;
    --red: #ff4d5e;
    --text-dim: #6f8f80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: "Consolas", "Courier New", monospace;
    overflow-x: hidden;
  }
  body { min-height: 100vh; position: relative; }

  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0.12) 1px,
      rgba(0, 0, 0, 0) 2px
    );
    mix-blend-mode: multiply;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%);
  }

  header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2.2rem 1rem 0.6rem;
  }
  .boot-line {
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    min-height: 1.1em;
  }
  h1 {
    margin-top: 0.6rem;
    font-size: clamp(1.4rem, 3.4vw, 2.4rem);
    letter-spacing: 0.35em;
    color: var(--green);
    text-shadow: 0 0 8px var(--green), 0 0 22px rgba(57,255,143,0.35);
    opacity: 0;
    animation: reveal 0.6s ease-out 1.4s forwards;
  }
  h1 span { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .subtitle {
    margin-top: 0.4rem;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    opacity: 0;
    animation: reveal 0.6s ease-out 1.7s forwards;
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  main {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1.5rem 2rem 3rem;
    opacity: 0;
    animation: reveal 0.8s ease-out 1.9s forwards;
  }

  .graph-wrap {
    position: relative;
    width: 700px;
    height: 700px;
    max-width: 92vw;
    max-height: 92vw;
  }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 150px; height: 150px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid var(--green);
    background: radial-gradient(circle, rgba(20,82,47,0.55), rgba(5,8,7,0.9));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    box-shadow: 0 0 25px rgba(57,255,143,0.5), inset 0 0 25px rgba(57,255,143,0.25);
    animation: hubpulse 3.4s ease-in-out infinite;
    z-index: 3;
  }
  .hub b { font-size: 1.05rem; letter-spacing: 0.12em; }
  .hub span { font-size: 0.62rem; letter-spacing: 0.2em; color: var(--cyan); margin-top: 0.2rem; }
  @keyframes hubpulse {
    0%, 100% { box-shadow: 0 0 25px rgba(57,255,143,0.5), inset 0 0 25px rgba(57,255,143,0.2); }
    50% { box-shadow: 0 0 42px rgba(57,255,143,0.85), inset 0 0 32px rgba(57,255,143,0.4); }
  }

  .node {
    position: absolute;
    top: 50%; left: 50%;
    width: 128px;
    transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) translate(-50%, -50%);
    border: 1px solid var(--green-dim);
    background: rgba(5, 15, 11, 0.85);
    border-radius: 8px;
    padding: 0.55rem 0.5rem;
    text-align: center;
    z-index: 3;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .node:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(76,224,255,0.4);
  }
  .node.live { border-color: var(--red); }
  .node .val {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(76,224,255,0.6);
  }
  .node.live .val { color: var(--red); text-shadow: 0 0 6px rgba(255,77,94,0.6); }
  .node .lbl {
    margin-top: 0.15rem;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    margin-right: 0.3rem;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .pulse-dot { fill: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
  .edge { stroke: var(--green-dim); stroke-width: 1; }

  aside.terminal-log {
    width: 320px;
    max-width: 90vw;
    height: 420px;
    border: 1px solid var(--green-dim);
    background: rgba(5, 12, 9, 0.85);
    border-radius: 6px;
    padding: 0.8rem;
    font-size: 0.72rem;
    line-height: 1.55;
    overflow: hidden;
    position: relative;
  }
  aside.terminal-log::before {
    content: "SYSTEM.LOG";
    position: absolute;
    top: 0.5rem; right: 0.7rem;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  #logBody { display: flex; flex-direction: column; gap: 0.15rem; margin-top: 1.4rem; }
  #logBody div { color: var(--green); opacity: 0.9; white-space: pre-wrap; word-break: break-word; }
  #logBody div.ok { color: var(--cyan); }
  #logBody div .prompt { color: var(--text-dim); }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 1rem 2rem;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .corner-readout {
    position: fixed;
    top: 0.9rem;
    z-index: 6;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  #clock { right: 1.2rem; text-align: right; }
  #uptime { left: 1.2rem; text-align: left; }
  .corner-readout b { color: var(--cyan); }

  .radar-sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(57,255,143,0.28), rgba(57,255,143,0) 22%, rgba(57,255,143,0) 100%);
    animation: sweep 5s linear infinite;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 1;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .side-col { display: flex; flex-direction: column; gap: 1.2rem; }

  .chart-panel {
    width: 320px;
    max-width: 90vw;
    border: 1px solid var(--green-dim);
    background: rgba(5, 12, 9, 0.85);
    border-radius: 6px;
    padding: 0.8rem;
    position: relative;
  }
  .chart-title {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
  }
  .chart-title span.live { color: var(--red); }
  #playerChart { width: 100%; height: 110px; display: block; }

  @media (max-width: 860px) {
    .graph-wrap { display: none; }
    main { flex-direction: column; }
    .mobile-stats {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.7rem;
      width: 100%;
      max-width: 480px;
    }
    .mobile-stats .node {
      position: static;
      width: 100%;
      transform: none;
    }
  }
  .mobile-stats { display: none; }
</style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="corner-readout" id="clock">SYSTEMZEIT: <b>--:--:--</b></div>
  <div class="corner-readout" id="uptime">SITZUNG AKTIV: <b>00:00:00</b></div>

  <header>
    <div class="boot-line" id="bootLine">&nbsp;</div>
    <h1>VOXERIA <span>// INTEL</span></h1>
    <div class="subtitle">Zugriffsstufe: geheim &middot; Live-Projektdaten</div>
  </header>

  <main>
    <div class="graph-wrap">
      <div class="radar-sweep"></div>
      <svg id="lines" viewBox="0 0 700 700"></svg>

      <div class="hub"><b>VOXERIA</b><span>CORE</span></div>

      <div class="node live" id="node-players" style="--a:-90deg; --r:260px;">
        <div class="val"><span class="live-dot"></span><span id="statPlayers">--</span></div>
        <div class="lbl">Spieler online</div>
      </div>
      <div class="node live" id="node-peak" style="--a:-50deg; --r:260px;">
        <div class="val" id="statPeak">--</div>
        <div class="lbl">24h Highscore</div>
      </div>
      <div class="node" style="--a:-10deg; --r:260px;">
        <div class="val" id="statDays">--</div>
        <div class="lbl">Entwicklungstage</div>
      </div>
      <div class="node" style="--a:30deg; --r:260px;">
        <div class="val">35</div>
        <div class="lbl">Commits</div>
      </div>
      <div class="node" style="--a:70deg; --r:260px;">
        <div class="val">24.953</div>
        <div class="lbl">Zeilen Code</div>
      </div>
      <div class="node" style="--a:110deg; --r:260px;">
        <div class="val">89</div>
        <div class="lbl">Dateien</div>
      </div>
      <div class="node" style="--a:150deg; --r:260px;">
        <div class="val">63</div>
        <div class="lbl">Assets</div>
      </div>
      <div class="node" style="--a:190deg; --r:260px;">
        <div class="val">21</div>
        <div class="lbl">Blocktypen</div>
      </div>
      <div class="node" style="--a:230deg; --r:260px;">
        <div class="val">2</div>
        <div class="lbl">Entwickler</div>
      </div>
    </div>

    <div class="side-col">
      <div class="chart-panel">
        <div class="chart-title">SPIELERVERLAUF<span class="live">&nbsp;&#9679; LIVE</span></div>
        <canvas id="playerChart" width="320" height="110"></canvas>
      </div>

      <aside class="terminal-log">
        <div id="logBody"></div>
      </aside>
    </div>
  </main>

  <footer id="footer">Datenstand wird geladen…</footer>

<script type="module">
  // ---- Hintergrund: treibende Datenpartikel ----
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.3,
      vy: Math.random() * 0.25 + 0.05,
      a: Math.random() * 0.6 + 0.15
    }));
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#39ff8f';
    for (const p of particles) {
      ctx.globalAlpha = p.a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.y -= p.vy;
      if (p.y < -5) p.y = canvas.height + 5;
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ---- Verbindungslinien zum Core zeichnen ----
  const svg = document.getElementById('lines');
  const NODE_ANGLES = [-90, -50, -10, 30, 70, 110, 150, 190, 230];
  const CENTER = 350, RADIUS = 260;
  NODE_ANGLES.forEach((deg, i) => {
    const rad = deg * Math.PI / 180;
    const x2 = CENTER + RADIUS * Math.cos(rad);
    const y2 = CENTER + RADIUS * Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', CENTER); line.setAttribute('y1', CENTER);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'edge');
    svg.appendChild(line);

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', 3.5);
    dot.setAttribute('class', 'pulse-dot');
    const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
    anim.setAttribute('dur', (2.4 + (i % 4) * 0.5) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    anim.setAttribute('path', `M${CENTER},${CENTER} L${x2},${y2}`);
    anim.setAttribute('begin', (i * 0.35) + 's');
    dot.appendChild(anim);
    svg.appendChild(dot);
  });

  // ---- Uhrzeit und Session-Timer, live tickend ----
  const clockEl = document.getElementById('clock');
  const uptimeEl = document.getElementById('uptime');
  const sessionStart = Date.now();
  function pad(n) { return String(n).padStart(2, '0'); }
  function tickClocks() {
    const now = new Date();
    clockEl.innerHTML = `SYSTEMZEIT: <b>${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</b>`;
    const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    const h = Math.floor(elapsed / 3600), m = Math.floor((elapsed % 3600) / 60), s = elapsed % 60;
    uptimeEl.innerHTML = `SITZUNG AKTIV: <b>${pad(h)}:${pad(m)}:${pad(s)}</b>`;
  }
  tickClocks();
  setInterval(tickClocks, 1000);

  // ---- Live-Liniendiagramm der Spielerzahl ----
  const chartCanvas = document.getElementById('playerChart');
  const chartCtx = chartCanvas.getContext('2d');
  const HISTORY_LEN = 40;
  const playerHistory = new Array(HISTORY_LEN).fill(0);
  let currentPlayers = 0;

  function drawChart() {
    const w = chartCanvas.width, h = chartCanvas.height;
    chartCtx.clearRect(0, 0, w, h);
    const maxVal = Math.max(1, ...playerHistory);
    const stepX = w / (HISTORY_LEN - 1);

    chartCtx.strokeStyle = 'rgba(57,255,143,0.15)';
    chartCtx.lineWidth = 1;
    for (let g = 1; g <= 3; g++) {
      const y = h - (h * g / 4);
      chartCtx.beginPath();
      chartCtx.moveTo(0, y);
      chartCtx.lineTo(w, y);
      chartCtx.stroke();
    }

    chartCtx.beginPath();
    playerHistory.forEach((v, i) => {
      const x = i * stepX;
      const y = h - (v / maxVal) * (h - 14) - 4;
      if (i === 0) chartCtx.moveTo(x, y); else chartCtx.lineTo(x, y);
    });
    chartCtx.strokeStyle = '#4ce0ff';
    chartCtx.lineWidth = 1.6;
    chartCtx.shadowColor = 'rgba(76,224,255,0.8)';
    chartCtx.shadowBlur = 6;
    chartCtx.stroke();
    chartCtx.shadowBlur = 0;

    const lastX = (HISTORY_LEN - 1) * stepX;
    const lastY = h - (playerHistory[HISTORY_LEN - 1] / maxVal) * (h - 14) - 4;
    chartCtx.beginPath();
    chartCtx.arc(lastX, lastY, 3, 0, Math.PI * 2);
    chartCtx.fillStyle = '#ff4d5e';
    chartCtx.fill();
  }
  function sampleChart() {
    playerHistory.push(currentPlayers);
    playerHistory.shift();
    drawChart();
  }
  drawChart();
  setInterval(sampleChart, 2000);

  // ---- Boot-Sequenz ----
  const bootLine = document.getElementById('bootLine');
  const bootMsgs = [
    '> Verbindung zu VOXERIA_CORE.DB wird aufgebaut...',
    '> Authentifizierung anonym... OK',
    '> Entschluesselung der Projektdaten...',
    '> ZUGRIFF GEWAEHRT'
  ];
  let bi = 0;
  function typeBoot() {
    if (bi >= bootMsgs.length) return;
    bootLine.textContent = bootMsgs[bi];
    bi++;
    setTimeout(typeBoot, 420);
  }
  typeBoot();

  // ---- Entwicklungstage (echt, ab erstem Commit) ----
  const START_DATE = new Date('2026-06-14T00:00:00');
  function updateDays() {
    const days = Math.max(1, Math.floor((Date.now() - START_DATE.getTime()) / 86400000));
    document.getElementById('statDays').textContent = days;
  }
  updateDays();

  // ---- Terminal-Log, dekorativ ----
  const logBody = document.getElementById('logBody');
  const logLines = [
    ['>', 'Scan: voxeria-engine.js', 'ok'],
    ['>', '12.147 Zeilen indiziert', 'ok'],
    ['>', 'Scan: voxeria-modding.js', 'ok'],
    ['>', 'Blockregister: 21 Typen erkannt', 'ok'],
    ['>', 'Dimension "The Erg" verifiziert', 'ok'],
    ['>', 'Firebase-Kanal synchronisiert', 'ok'],
    ['>', 'Spielerpraesenz: Echtzeit aktiv', 'ok'],
    ['>', 'Keine Anomalien gefunden', ''],
    ['>', 'Datenintegritaet: 100%', 'ok'],
  ];
  let li = 0;
  function pushLog() {
    const [prompt, text, cls] = logLines[li % logLines.length];
    const row = document.createElement('div');
    if (cls) row.className = cls;
    row.innerHTML = `<span class="prompt">${prompt}</span> ${text}`;
    logBody.appendChild(row);
    while (logBody.children.length > 14) logBody.removeChild(logBody.firstChild);
    li++;
    setTimeout(pushLog, 1500 + Math.random() * 900);
  }
  setTimeout(pushLog, 1800);

  // ---- Live-Firebase-Daten (gleiches Projekt wie Voxeria_live_stats.html) ----
  const firebaseConfig = {
    apiKey: "AIzaSyAZzGkkqTyRxbJDehI-gtsNjf6IcgAPZoY",
    authDomain: "voxeria-1e357.firebaseapp.com",
    projectId: "voxeria-1e357",
    storageBucket: "voxeria-1e357.firebasestorage.app",
    messagingSenderId: "361199903585",
    appId: "1:361199903585:web:50c05d50e9eae3b1c25b20"
  };
  const STALE_MS = 15000;
  const DAY_MS = 24 * 60 * 60 * 1000;
  const footer = document.getElementById('footer');

  async function connectFirebase() {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
      const { getAuth, signInAnonymously, onAuthStateChanged } =
        await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
      const { getFirestore, collection, doc, onSnapshot } =
        await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const appId = firebaseConfig.projectId;
      const peakRef = doc(db, 'artifacts', appId, 'public', 'data', 'voxeria_stats', 'dailyPeak');
      const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'voxeria_players');

      onAuthStateChanged(auth, (user) => {
        if (!user) return;
        footer.textContent = 'Live verbunden mit VOXERIA_CORE.DB';

        onSnapshot(playersRef, (snapshot) => {
          const now = Date.now();
          let count = 0;
          snapshot.forEach((d) => {
            const data = d.data();
            if (now - (data.ts || 0) < STALE_MS) count++;
          });
          document.getElementById('statPlayers').textContent = count;
          currentPlayers = count;
        }, () => { footer.textContent = 'Verbindungsfehler zu VOXERIA_CORE.DB'; });

        onSnapshot(peakRef, (snap) => {
          const peakEl = document.getElementById('statPeak');
          if (!snap.exists()) { peakEl.textContent = '0'; return; }
          const data = snap.data();
          peakEl.textContent = (Date.now() - (data.windowStart || 0) > DAY_MS) ? '0' : (data.count ?? '0');
        });
      });

      signInAnonymously(auth).catch(() => { footer.textContent = 'Keine Verbindung zu VOXERIA_CORE.DB'; });
    } catch (e) {
      footer.textContent = 'VOXERIA_CORE.DB offline, zeige letzten bekannten Stand';
      console.error(e);
    }
  }
  connectFirebase();
</script>

</body>
</html>
